[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raspi-air-monitor"
version = "0.1.0"
description = "Local ADS-B, VHF and GIS monitor for Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "shapely>=2.0",
  "pyproj>=3.6",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
